<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fun · Christopher Tytone</title>
  <meta name="description" content="The non-work stuff: games, hobbies, and whatever else.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero hero-compact">
    <div class="container">
      <nav class="links site-nav" aria-label="Site">
        <a class="btn" href="index.html">Home</a>
        <a class="btn btn-primary" href="fun.html" aria-current="page">Fun</a>
      </nav>
      <h1 class="name">Fun Stuff</h1>
      <p class="subline">Off the clock · games, hobbies, etc.</p>
    </div>
  </header>

  <main>
    <section id="fun" class="section" aria-labelledby="fun-heading">
      <div class="container">
        <h2 id="fun-heading" class="section-title">Rocket League</h2>
        <div class="fun-grid">

          <!--
            Filled in from data/rocket-league.json, which the
            "Update Rocket League rank" GitHub Action refreshes every 6 hours.
            If the file can't be loaded, the card shows "Rank unavailable".
          -->
          <article class="rank-card" id="rl-card">
            <p class="label" data-rl="playlist">Ranked Doubles · 2v2</p>
            <p class="rank-name" data-rl="rank">Rank loading…</p>
            <p class="rank-division" data-rl="division"></p>
            <p class="rank-mmr"><span data-rl="mmr">—</span> MMR</p>
            <p class="rank-meta">Epic: CyGy Ω · as of <time data-rl="updated">—</time></p>
            <a class="btn btn-small" href="https://rocketleague.tracker.network/rocket-league/profile/epic/CyGy%20%CE%A9/mmr?playlist=11" target="_blank" rel="noopener noreferrer">Live stats on Tracker</a>
          </article>

        </div>
      </div>
    </section>

    <section id="music" class="section" aria-labelledby="music-heading">
      <div class="container">
        <h2 id="music-heading" class="section-title">On Repeat</h2>
        <!-- Filled in live from Last.fm by the script at the bottom of this page -->
        <article class="np-card" id="np-card">
          <div class="np-art-wrap">
            <img class="np-art" id="np-art" alt="" width="300" height="300" hidden>
            <div class="np-art placeholder" id="np-art-placeholder" aria-hidden="true">♫</div>
          </div>
          <div class="np-body">
            <p class="label" id="np-status">Loading…</p>
            <p class="np-track" id="np-track">—</p>
            <p class="np-artist" id="np-artist"></p>
            <ol class="np-recent" id="np-recent" aria-label="Recently played"></ol>
            <a class="btn btn-small" id="np-profile" href="https://www.last.fm/" target="_blank" rel="noopener noreferrer">Last.fm profile</a>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer id="contact" class="section">
    <div class="container">
      <p class="small">© <span id="year"></span> Christopher Tytone</p>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Rocket League rank, written by the GitHub Action
    fetch('data/rocket-league.json', { cache: 'no-cache' })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(d => {
        const set = (k, v) => { const el = document.querySelector(`[data-rl="${k}"]`); if (el && v != null) el.textContent = v; };
        set('playlist', d.playlist);
        set('rank', d.rank);
        set('division', d.division);
        set('mmr', d.mmr != null ? Number(d.mmr).toLocaleString() : null);
        if (d.updated) {
          const t = document.querySelector('[data-rl="updated"]');
          t.dateTime = d.updated;
          t.textContent = new Date(d.updated).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }
      })
      .catch(() => {
        document.querySelector('[data-rl="rank"]').textContent = 'Rank unavailable';
      });

    // Last.fm now playing. The API key is a read-only public key (fine to
    // ship in the page); never put the Last.fm "shared secret" here.
    const LASTFM_USER = 'ctytone';
    const LASTFM_KEY = '8ba0504ce48da1bf2ca8a270a9230cf9';

    const $ = id => document.getElementById(id);
    $('np-profile').href = `https://www.last.fm/user/${encodeURIComponent(LASTFM_USER)}`;

    function timeAgo(unix) {
      const s = Math.floor(Date.now() / 1000) - unix;
      if (s < 3600) return `${Math.max(1, Math.floor(s / 60))} min ago`;
      if (s < 86400) return `${Math.floor(s / 3600)} hr ago`;
      return `${Math.floor(s / 86400)} days ago`;
    }

    function loadNowPlaying() {
      const url = 'https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&format=json&limit=5'
        + `&user=${encodeURIComponent(LASTFM_USER)}&api_key=${encodeURIComponent(LASTFM_KEY)}`;
      fetch(url)
        .then(r => r.json())
        .then(d => {
          const tracks = d?.recenttracks?.track;
          if (!tracks || !tracks.length) throw new Error(d?.message || 'No tracks');
          const [first, ...rest] = tracks;
          const live = first['@attr']?.nowplaying === 'true';

          $('np-status').textContent = live
            ? 'Now playing'
            : `Last played · ${first.date ? timeAgo(Number(first.date.uts)) : ''}`;
          $('np-card').classList.toggle('is-live', live);
          $('np-track').textContent = first.name;
          $('np-artist').textContent = first.artist['#text'];

          // Last.fm returns an empty string or a grey star placeholder when there's no art
          const art = first.image?.find(i => i.size === 'extralarge')?.['#text'];
          const hasArt = art && !art.includes('2a96cbd8b46e442fc41c2b86b821562f');
          $('np-art').hidden = !hasArt;
          $('np-art-placeholder').hidden = hasArt;
          if (hasArt) {
            $('np-art').src = art;
            $('np-art').alt = `Album art for ${first.album?.['#text'] || first.name}`;
          }

          $('np-recent').replaceChildren(...rest.slice(0, 4).map(t => {
            const li = document.createElement('li');
            li.textContent = `${t.name} — ${t.artist['#text']}`;
            return li;
          }));
        })
        .catch(() => {
          $('np-status').textContent = 'Offline';
          $('np-track').textContent = 'Music unavailable';
        });
    }
    loadNowPlaying();
    setInterval(loadNowPlaying, 60000);
  </script>
</body>
</html>
